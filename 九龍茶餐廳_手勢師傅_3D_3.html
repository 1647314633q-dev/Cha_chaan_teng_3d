<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#140e0b">
<title>九龍茶餐廳：手勢師傅</title>
<style>
:root{
  --ink:#2b211c;--paper:#fffaf0;--cream:#f6ecd4;--red:#c7352b;--red-d:#9e241c;--gold:#f2b33d;--green:#1d5a46;--mint:#a9d3bf;--line:#e3d3b2;--muted:#7a6656;--edge:#3a2b22;
  --sans:"PingFang HK","PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Songti TC","Noto Serif TC","Noto Serif CJK TC","PMingLiU","MingLiU","SimSun",serif;
  --hand:"Kaiti TC","STKaiti","BiauKai","DFKai-SB","KaiTi",var(--serif);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--sans);color:var(--ink);background:#1d1612;
  background-image:radial-gradient(ellipse at 50% 0,#3a2a1e 0,#1d1612 60%),repeating-linear-gradient(90deg,#ffffff06 0 2px,transparent 2px 60px);
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.app{max-width:1240px;margin:0 auto;padding:12px 14px 18px}

/* 招牌 */
.sign{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"neon hud ctrl" "prog prog prog";align-items:center;gap:8px 14px;padding:10px 16px 12px;color:#fff;
  background:linear-gradient(#1b4b3c,#123d30);border:4px solid #6b4426;border-radius:16px;box-shadow:inset 0 0 0 2px #e9c27a44,0 6px 0 #3b2716,0 14px 30px #0006}
.neon{grid-area:neon;font-family:var(--serif);font-weight:900;font-size:clamp(24px,3.8vw,36px);letter-spacing:4px;color:#fff3ec;line-height:1.1;
  text-shadow:0 0 3px #fff,0 0 10px #ff6a55,0 0 22px #ff3b2f,0 0 40px #ff3b2f;animation:flicker 7s infinite}
.neon small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:3px;color:#ffd77a;text-shadow:0 0 6px #ffb300;margin-top:3px;font-weight:700}
@keyframes flicker{0%,92%,100%{opacity:1}93%{opacity:.5}94%{opacity:1}96%{opacity:.75}}
.hud{grid-area:hud;display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.pill{background:#0b2a20;border:2px solid #2f6b56;border-radius:12px;padding:4px 12px;min-width:74px;text-align:center}
.pill .k{display:block;font-size:11px;color:var(--mint);letter-spacing:1px}
.pill .v{display:block;font-weight:900;font-size:19px;color:#ffe08a;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.warn .v{color:#ff8a7a;animation:pulse .5s infinite alternate}
.pill.hot{box-shadow:0 0 0 2px #ffb13b,0 0 18px #ff7a1a}
.ctrl{grid-area:ctrl;display:flex;gap:6px}
.iconbtn{width:42px;height:42px;border-radius:12px;border:2px solid #2f6b56;background:#0b2a20;color:#fff;font-size:18px;cursor:pointer}
.progress{grid-area:prog;position:relative;height:12px;background:#0b2a20;border:2px solid #2f6b56;border-radius:99px}
.progress i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#f2b33d,#ffe28a);box-shadow:0 0 10px #f2b33d88;transition:width .45s}
.progress .pst{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:15px;filter:grayscale(1) brightness(.6);transition:.3s}
.progress .pst.on{filter:none;transform:translate(-50%,-50%) scale(1.25)}

/* 版面 */
.game{display:grid;grid-template-columns:340px 1fr;gap:14px;margin-top:12px;align-items:start}
.card{position:relative;background:var(--paper);border:2px solid var(--edge);border-radius:18px;padding:14px;box-shadow:0 5px 0 #0003,0 12px 26px #0004}
.side{display:flex;flex-direction:column;gap:12px}
.custRow{display:flex;gap:12px;align-items:center}
.avatar{position:relative;width:80px;height:80px;flex:none}
.avatar svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ringbg{fill:none;stroke:#eadfca;stroke-width:8}
.ring{fill:none;stroke:#4caf6e;stroke-width:8;stroke-linecap:round;stroke-dasharray:282.7;stroke-dashoffset:0;transition:stroke .3s}
.face{position:absolute;inset:8px;border-radius:50%;display:grid;place-items:center;font-size:38px;background:radial-gradient(circle at 40% 32%,#fff,#f0dfbd)}
.mood{position:absolute;right:-4px;bottom:-4px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:19px;background:#fff;border:2px solid var(--edge)}
.avatar.enter{animation:enter .5s cubic-bezier(.2,1.5,.4,1)}.avatar.happy{animation:hop .5s}.avatar.angry{animation:shake .45s}
.bubble{position:relative;flex:1;min-height:54px;background:#fff;border:2px solid var(--edge);border-radius:14px;padding:7px 11px;font-weight:800;line-height:1.4;font-size:15px}
.bubble:before{content:"";position:absolute;left:-9px;top:20px;width:14px;height:14px;background:#fff;border-left:2px solid var(--edge);border-bottom:2px solid var(--edge);transform:rotate(45deg)}
.bubble .who{display:block;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:1px}
.bubble.pop{animation:pop .3s}
.ticket{position:relative;padding:12px 14px;background:#fff;background-image:repeating-linear-gradient(#fff 0 27px,#e2edf5 27px 28px);border:1px solid #d8c9ac;border-radius:3px;transform:rotate(-.6deg);box-shadow:0 4px 10px #0000001f}
.t-head{display:flex;justify-content:space-between;font-size:11px;color:var(--red);font-weight:900;letter-spacing:2px;border-bottom:2px solid var(--red);padding-bottom:4px;margin-bottom:6px}
.t-dish{display:flex;align-items:center;gap:8px;font-family:var(--hand);font-size:28px;font-weight:700;line-height:1.2}
.t-dish .emo{font-family:var(--sans)}.t-dish .price{margin-left:auto;font:900 18px var(--sans);color:var(--red)}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.t-brand{display:block;width:96px;margin:10px 0 0 auto;opacity:.52;line-height:0;transition:opacity .2s;-webkit-user-select:none;user-select:none}
.t-brand:hover,.t-brand:focus-visible{opacity:.92}
.t-brand img{display:block;width:100%;height:auto}
.st{display:flex;align-items:center;gap:4px;border:2px dashed #c9b48e;border-radius:10px;padding:3px 8px;font-weight:800;font-size:13px;background:#fffdf6;transition:.2s}
.st.now{border-style:solid;border-color:var(--red);background:#fff1c7;transform:scale(1.06);box-shadow:0 0 0 3px #c7352b22}
.st.done{border-style:solid;border-color:#3f8a5c;background:#e3f5e8;color:#245c39}
.st.done.bad{border-color:#d08a2a;background:#fff2db;color:#8a5a12}
.st b{font-size:11px;margin-left:2px}
.log{font-size:13px;color:#5b4a3c;max-height:150px;overflow:auto}
.log div{padding:4px 0;border-bottom:1px dashed var(--line)}
.side h2{margin:0 0 6px;font-size:14px;color:#5b4636}

/* 舞台 */
.stagecard{padding:8px;background:#2a1d14;border-color:#120c08}
.stage{position:relative;height:min(76vh,680px);min-height:420px;border-radius:12px;overflow:hidden;background:#140e0b;touch-action:none;-webkit-user-select:none;user-select:none;cursor:crosshair}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage canvas.gl3d{z-index:0}
.stage .ov{z-index:2}
.stage:after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(10,6,3,.55) 100%)}
.banner{position:absolute;left:12px;right:12px;top:12px;z-index:5;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;
  background:rgba(20,14,10,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;border:1px solid #ffffff22;pointer-events:none}
.banner .gi{font-size:30px;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(#ffa53b,#e5641a);box-shadow:0 3px 0 #8a3a0c;flex:none}
.banner b{display:block;font-size:19px;letter-spacing:1px}
.banner small{display:block;font-size:13px;color:#ffe7c2;opacity:.9}
.banner .cnt{margin-left:auto;font:900 24px var(--sans);color:#ffe08a;font-variant-numeric:tabular-nums}
.banner.pop{animation:pop .35s}
.stepbar{position:absolute;left:12px;right:12px;top:84px;height:6px;z-index:5;background:#ffffff22;border-radius:9px;overflow:hidden;pointer-events:none}
.stepbar i{display:block;height:100%;width:100%;background:#5cc07f;border-radius:9px}
.tray{position:absolute;left:0;right:0;bottom:10px;z-index:6;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:0 10px;pointer-events:none}
.tok{pointer-events:auto;touch-action:none;display:flex;flex-direction:column;align-items:center;gap:2px;width:72px;padding:6px 0 5px;border-radius:16px;background:#fffaf0;border:2px solid var(--edge);
  box-shadow:0 4px 0 #0006;font-weight:900;font-size:12px;cursor:grab;transition:transform .15s,opacity .2s}
.tok .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:var(--c,#f3e7cf);box-shadow:inset 0 -3px 0 #0002}
.tok.used{opacity:.25;transform:scale(.85);pointer-events:none}
.tok.wrong{animation:shake .4s;border-color:var(--red)}
.tok.drag{opacity:.35}
.ghost{position:fixed;z-index:80;pointer-events:none;transform:translate(-50%,-50%) scale(1.15);font-size:44px;filter:drop-shadow(0 6px 8px #0008)}
.fx{position:absolute;inset:0;pointer-events:none;z-index:7}
.stamp{position:absolute;left:50%;top:118px;transform:translate(-50%,-50%) rotate(-6deg);white-space:nowrap;font:900 26px var(--serif);color:#ff5a4a;border:4px solid currentColor;border-radius:10px;padding:2px 16px;
  background:#1d1612cc;text-shadow:0 0 12px currentColor;animation:stamp .8s cubic-bezier(.2,1.6,.4,1) forwards}
.stamp.great{color:#6ff0a0}.stamp.good{color:#ffd35a}
.toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);z-index:8;background:#000a;color:#fff;font-weight:900;padding:6px 14px;border-radius:99px;font-size:14px;animation:floatup2 1.2s forwards;pointer-events:none;white-space:nowrap}
.floater{position:fixed;z-index:70;pointer-events:none;transform:translate(-50%,-50%);font-weight:900;font-size:24px;color:#2a8a54;white-space:nowrap;
  text-shadow:0 2px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff;animation:floatup 1.2s ease-out forwards}
.floater.bad{color:var(--red)}.floater.tip{color:#c88a00;font-size:20px}
.flydish{position:fixed;z-index:75;pointer-events:none;transform:translate(-50%,-50%);display:grid;place-items:center}
.flydish i{font-style:normal;font-size:58px;filter:drop-shadow(0 8px 10px #0008)}.flydish span{position:absolute;font-size:34px;top:2px;z-index:1}
.floater.heart{font-size:22px}
.avatar.eat{animation:eat .75s}
@keyframes eat{15%,55%{transform:scale(1.14) rotate(-5deg)}35%,75%{transform:scale(.94) rotate(5deg)}}
.footer{text-align:center;color:#a8957f;font-size:12px;margin-top:14px}

/* 疊層 */
.overlay{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;overflow:auto;background:radial-gradient(circle at 50% 20%,#3a2a1eee,#0d0805f7)}
.overlay.hide{display:none}
.modal{width:min(780px,100%);background:var(--cream);border:3px solid var(--edge);border-radius:22px;box-shadow:0 10px 0 #0007,0 30px 60px #0008;padding:22px;text-align:center;animation:rise .35s cubic-bezier(.2,1.3,.4,1)}
.modal h1{margin:4px 0 6px;font-family:var(--serif);font-size:30px}
.modal h3{margin:16px 0 8px;font-size:15px;letter-spacing:2px;color:var(--red)}
.modal p{line-height:1.7;color:#5f4d3e;margin:6px 0}
.bigsign{background:linear-gradient(#1b4b3c,#123d30);border:4px solid #6b4426;border-radius:16px;padding:16px 12px;box-shadow:inset 0 0 0 2px #e9c27a44}
.bigsign .neon{font-size:clamp(32px,8vw,52px)}
.bigsign .tl{color:#ffd77a;font-weight:800;letter-spacing:3px;margin-top:6px;font-size:14px}
.gests{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px}
.gests span{background:#0b2a20;border:1px solid #2f6b56;color:#fff;border-radius:99px;padding:3px 10px;font-size:13px;font-weight:800}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:16px 0 10px}
.lv{position:relative;text-align:left;background:#fffaf0;border:2px solid var(--edge);border-radius:14px;padding:12px 14px;cursor:pointer;box-shadow:0 4px 0 #3a2b2240;display:flex;flex-direction:column;gap:2px}
.lv:hover:not(:disabled){transform:translateY(-3px)}
.lv .n{font-size:12px;color:var(--red);font-weight:900}.lv .t{font-family:var(--serif);font-size:22px;font-weight:900}.lv .sb{font-size:13px;font-weight:800;color:var(--green)}
.lv .d{font-size:12px;color:var(--muted);line-height:1.5}.lv .s{font-size:20px;letter-spacing:2px;margin-top:4px}
.lv:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.8)}.lv:disabled:after{content:"🔒";position:absolute;right:12px;top:12px;font-size:22px}
.st-on{color:#f2a51a;text-shadow:0 1px 0 #9a6200}.st-off{color:#cdbfa8}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.mainbtn{min-height:54px;padding:0 26px;border-radius:16px;border:3px solid var(--edge);color:#fff;font-size:19px;font-weight:900;letter-spacing:2px;cursor:pointer;background:linear-gradient(#e2473b,#b92c22);box-shadow:0 5px 0 #6e1a14}
.mainbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #6e1a14}
.subbtn{min-height:52px;padding:0 16px;border-radius:16px;border:3px solid var(--edge);background:#fff;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #3a2b2244}
.goal{display:inline-block;background:#fff;border:2px solid var(--edge);border-radius:12px;padding:6px 12px;font-weight:800;margin-top:4px}.goal b{color:var(--red)}
.recipes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;text-align:left}
.rc{background:#fff;border:1px solid #e0cfae;border-radius:12px;padding:8px 10px}
.rc-h{display:flex;align-items:center;gap:6px;font-weight:900;font-size:16px}.rc-h em{margin-left:auto;color:var(--red);font-style:normal}
.rc-i{font-size:13px;color:#5f4d3e;margin-top:4px;line-height:1.7}
.kicker{font-size:13px;font-weight:900;color:var(--red);letter-spacing:3px}
.bigstars{font-size:58px;letter-spacing:6px;margin:6px 0}
.bigstars span{display:inline-block;color:#d8cbb4;transform:scale(.4);opacity:0;animation:starIn .5s cubic-bezier(.2,1.8,.4,1) forwards}
.bigstars span.on{color:#f6b21f;text-shadow:0 3px 0 #9a6200,0 0 20px #ffd76a}
.money{font:900 44px var(--sans);color:var(--green)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:12px 0}
.stats div{background:#fff;border:2px solid #e3d3b2;border-radius:12px;padding:8px}.stats b{display:block;font-size:22px}.stats span{font-size:12px;color:var(--muted)}
.reviews{display:grid;gap:6px;text-align:left}
.rv{background:#fff;border-radius:12px;border:1px solid #e3d3b2;padding:7px 10px;font-size:14px;display:flex;gap:8px;align-items:center}
.rv .f{font-size:24px}.rv .r{margin-left:auto;color:#f2a51a;white-space:nowrap;font-size:12px}
.confetti{position:fixed;top:-20px;z-index:51;width:10px;height:14px;border-radius:2px;pointer-events:none;animation:fall linear forwards}

/* 落單紙：食材要求 */
.ings{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:6px;font-size:12px}
.ings:empty{display:none}
.ings .ih{font-weight:900;color:var(--red);letter-spacing:1px;margin-right:2px}
.ings .mh{color:var(--muted);font-weight:700}
.ings .ih,.ings .mh{white-space:nowrap;flex:none}.ig{flex:none}
.ig{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:99px;background:#fff6dc;border:1.5px solid #e2c88e;font-weight:800;white-space:nowrap;transition:.25s}
.ig.ok{background:#e3f5e8;border-color:#3f8a5c;color:#245c39}.ig.ok:after{content:"✓";font-weight:900;margin-left:1px}
.ig.pop{animation:igpop .45s cubic-bezier(.2,1.8,.4,1)}
.ings.memo{background:#f3ecff;border:1.5px dashed #9b7fd0;border-radius:10px;padding:4px 7px}.ings.memo .ih{color:#6a45b0}
.st .sn{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--red);color:#fff;font:900 10px var(--sans);font-style:normal}
.st.done .sn{background:#3f8a5c}.st .amt{font-size:11px;color:#8a6a4a;font-weight:700}
.st.q{color:#9b8bb8;border-color:#cdbfe6;background:#f7f3ff}
.rc-g{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}.rc-g .ig{font-size:12px;padding:1px 6px}
.rc-i.memo{color:#6a45b0;font-weight:800}
/* 落料托盤動畫 */
.tok{animation:tokin .35s cubic-bezier(.2,1.5,.4,1) backwards}
.tray.out .tok{transition:transform .25s,opacity .25s;opacity:0!important;transform:translateY(24px) scale(.8)!important}
.ghost{transition:transform .12s}.ghost.hot{transform:translate(-50%,-50%) scale(1.35) rotate(-8deg)}
.floater.ing{font-size:20px;color:#b86a00}
/* 分數拆解 */
.stamp small{display:block;font:800 13px var(--sans);letter-spacing:1px;color:#fff;text-shadow:none;margin-top:1px;text-align:center}
.scorecard{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:9;width:min(340px,92%);background:#fffaf0;color:var(--ink);border:2px solid var(--edge);border-radius:16px;padding:10px 12px;box-shadow:0 6px 0 #0005,0 14px 28px #0007;animation:scin 2.6s ease forwards;pointer-events:none}
.scorecard .sh{display:flex;align-items:center;gap:6px;font-weight:900;font-size:15px}.scorecard .sh b{margin-left:auto;font-size:22px;color:var(--red)}
.scorecard .bar{display:grid;grid-template-columns:44px 1fr 30px;align-items:center;gap:6px;font-size:12px;font-weight:800;margin-top:5px}
.scorecard .bar i{display:block;height:9px;border-radius:9px;background:#eadfca;overflow:hidden}.scorecard .bar i u{display:block;height:100%;border-radius:9px;width:0;animation:barfill .7s .15s ease-out forwards}
.scorecard .fm{font-size:11px;color:var(--muted);margin-top:5px;text-align:center}
.scorecard .mn{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;font-size:12px;font-weight:800;margin-top:5px;border-top:1px dashed var(--line);padding-top:5px}.scorecard .mn em{font-style:normal;color:#2a8a54}
.howscore{text-align:left;background:#fff;border:2px solid #e3d3b2;border-radius:12px;padding:8px 12px;margin-top:10px;font-size:13px;color:#5f4d3e}
.howscore summary{font-weight:900;cursor:pointer;color:var(--ink)}.howscore ul{margin:6px 0 2px;padding-left:18px;line-height:1.7}
@keyframes igpop{0%{transform:scale(.6)}60%{transform:scale(1.18)}}
@keyframes tokin{from{transform:translateY(30px) scale(.7);opacity:0}}
@keyframes scin{0%{opacity:0;transform:translate(-50%,20px) scale(.92)}10%,82%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,10px)}}
@keyframes barfill{to{width:var(--w)}}
@keyframes pulse{to{opacity:.6}}
@keyframes enter{from{transform:translateX(-60px) scale(.6);opacity:0}}
@keyframes hop{30%{transform:translateY(-14px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes pop{from{transform:scale(.85);opacity:.4}}
@keyframes stamp{0%{transform:translate(-50%,-50%) rotate(-6deg) scale(2);opacity:0}25%{transform:translate(-50%,-50%) rotate(-6deg) scale(1);opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%) rotate(-6deg)}}
@keyframes rise{from{transform:translateY(30px) scale(.96);opacity:0}}
@keyframes floatup{0%{transform:translate(-50%,-30%) scale(.6);opacity:0}15%{transform:translate(-50%,-50%) scale(1.15);opacity:1}100%{transform:translate(-50%,-160%);opacity:0}}
@keyframes floatup2{0%{opacity:0;transform:translate(-50%,10px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-20px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes starIn{to{transform:scale(1);opacity:1}}

/* 手機 */
@media (max-width:820px){
  .app{padding:6px 8px calc(10px + env(safe-area-inset-bottom))}
  .sign{grid-template-columns:1fr auto;grid-template-areas:"neon ctrl" "hud hud" "prog prog";padding:7px 10px 9px;gap:6px;border-width:3px}
  .neon{font-size:21px;letter-spacing:2px}.neon small{font-size:9px;letter-spacing:2px}
  .hud{display:grid;grid-template-columns:1fr 1.2fr .9fr .9fr;gap:5px}
  .pill{min-width:0;padding:2px 4px;border-radius:10px}.pill .k{font-size:10px}.pill .v{font-size:15px}
  .iconbtn{width:38px;height:38px;font-size:16px}
  .game{grid-template-columns:1fr;gap:8px;margin-top:8px}
  .side{order:0;gap:6px}
  .side .card{padding:8px}
  .logcard{display:none}
  .custRow{gap:8px}
  .avatar{width:54px;height:54px}.face{inset:6px;font-size:26px}.mood{width:24px;height:24px;font-size:13px}
  .bubble{font-size:13px;min-height:44px;padding:5px 9px}.bubble:before{top:14px}
  .ticket{padding:7px 9px;transform:none;margin-top:6px}
  .t-head{display:none}
  .t-dish{font-size:21px}.t-dish .price{font-size:15px}
  .steps{margin-top:4px;gap:4px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .st{font-size:12px;padding:2px 6px;flex:none}
  .stagecard{padding:5px;border-radius:16px}
  .stage{height:calc(100dvh - 372px);min-height:360px}
  .banner{left:8px;right:8px;top:8px;padding:6px 9px;gap:8px}
  .banner .gi{width:38px;height:38px;font-size:24px}.banner b{font-size:16px}.banner small{font-size:11.5px}.banner .cnt{font-size:20px}
  .stepbar{top:68px;left:8px;right:8px}
  .tray{gap:5px;flex-wrap:nowrap;padding:0 6px}
  .tok{width:auto;flex:1 1 0;max-width:62px;min-width:0;font-size:11px;white-space:nowrap}.tok .ic{width:34px;height:34px;font-size:21px}
  .ings{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-top:4px;font-size:11px}.ig{padding:1px 6px}
  .scorecard{bottom:auto;top:78px;padding:8px 10px;animation-delay:.3s;animation-fill-mode:both}
  .levels{grid-template-columns:1fr 1fr;gap:8px}.lv{padding:10px}.lv .d{display:none}.lv .t{font-size:19px}
  .modal{padding:16px}.modal h1{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="sign">
    <div class="neon">九龍茶餐廳<small>手勢師傅 · GESTURE CHEF</small></div>
    <div class="hud">
      <div class="pill"><span class="k">日子</span><span class="v" id="hLv">—</span></div>
      <div class="pill"><span class="k">營業額</span><span class="v" id="hScore">$0</span></div>
      <div class="pill" id="hTimeP"><span class="k">剩餘秒</span><span class="v" id="hTime">0</span></div>
      <div class="pill" id="hStreakP"><span class="k">連擊</span><span class="v" id="hStreak">0</span></div>
    </div>
    <div class="ctrl"><button class="iconbtn" id="btnSound" aria-label="音效開關">🔊</button><button class="iconbtn" id="btnPause" aria-label="暫停">⏸</button></div>
    <div class="progress" aria-hidden="true"><i id="progBar"></i><span class="pst" id="ps0">⭐</span><span class="pst" id="ps1">⭐</span><span class="pst" id="ps2">⭐</span></div>
  </header>
  <main class="game">
    <aside class="side">
      <section class="card">
        <div class="custRow">
          <div class="avatar" id="avatar"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="45" class="ringbg"/><circle cx="50" cy="50" r="45" class="ring" id="ring"/></svg><div class="face" id="face">🧑‍🍳</div><div class="mood" id="mood">💪</div></div>
          <div class="bubble" id="bubble"><span class="who" id="who">樓面</span><span id="say">師傅，準備好就開工！</span></div>
        </div>
        <div class="ticket">
          <div class="t-head"><span>九龍茶餐廳 · 落單紙</span><span id="tNo">No.000</span></div>
          <div class="t-dish"><span class="emo" id="tEmo">🍳</span><span id="tName">等開工</span><span class="price" id="tPrice"></span></div>
          <div class="ings" id="ings"></div>
          <div class="steps" id="steps"></div>
          <a class="t-brand" id="tBrand" href="https://rightpickhk.com/" target="_blank" rel="noopener noreferrer"
             title="RightPick · rightpickhk.com" aria-label="RightPick 官網"><img id="tBrandImg" alt="RightPick"></a>
        </div>
      </section>
      <section class="card logcard"><h2>📋 出餐紀錄</h2><div class="log" id="log"></div></section>
    </aside>
    <section class="card stagecard">
      <div class="stage" id="stage">
        <canvas class="ov" id="ov"></canvas>
        <div class="banner" id="banner"><span class="gi" id="bIc">👆</span><div><b id="bTitle">準備開工</b><small id="bSub">揀日子開始</small></div><span class="cnt" id="bCnt"></span></div>
        <div class="stepbar"><i id="stepBar"></i></div>
        <div class="tray" id="tray"></div>
        <div class="fx" id="fx"></div>
      </div>
    </section>
  </main>
  <div class="footer">單檔離線小遊戲 · 3D 由 three.js（MIT）即場繪製 · 音效即時合成 · 毋須網絡、帳號或安裝</div>
</div>
<div class="overlay" id="overlay"></div>

const AFX=(()=>{
  let ctx=null,master=null,buf=null,loopN=null,on=save.sound!==false;
  function init(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    if(!ctx){try{ctx=new AC();master=ctx.createGain();master.gain.value=.55;master.connect(ctx.destination);buf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){ctx=null;return}}
    if(ctx.state==='suspended')ctx.resume()}
  function tone(f,dur,o={}){if(!on||!ctx)return;const t=ctx.currentTime+(o.at||0);const osc=ctx.createOscillator(),g=ctx.createGain();osc.type=o.type||'sine';osc.frequency.setValueAtTime(f,t);if(o.to)osc.frequency.exponentialRampToValueAtTime(o.to,t+dur);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(o.vol||.15,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dur);osc.connect(g);g.connect(master);osc.start(t);osc.stop(t+dur+.03)}
  function noise(dur,o={}){if(!on||!ctx)return;const t=ctx.currentTime+(o.at||0);const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=buf;f.type=o.type||'bandpass';f.frequency.setValueAtTime(o.f||1000,t);if(o.to)f.frequency.exponentialRampToValueAtTime(o.to,t+dur);f.Q.value=o.q||1;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(o.vol||.2,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random());s.stop(t+dur+.05)}
  function loop(kind){if(!on||!ctx)return;stopLoop();const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=buf;s.loop=true;
    f.type=kind==='pour'?'bandpass':'highpass';f.frequency.value=kind==='pour'?900:2600;f.Q.value=kind==='pour'?.7:1;g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(kind==='pour'?.09:.05,ctx.currentTime+.15);
    s.connect(f);f.connect(g);g.connect(master);s.start();loopN={s,g}}
  function stopLoop(){if(!loopN||!ctx)return;const {s,g}=loopN;loopN=null;try{g.gain.cancelScheduledValues(ctx.currentTime);g.gain.setValueAtTime(g.gain.value,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.15);s.stop(ctx.currentTime+.2)}catch(e){}}
  const fx={
    tap(){tone(880,.05,{type:'triangle',vol:.07})},
    chop(){noise(.08,{vol:.35,type:'lowpass',f:900});tone(140,.09,{vol:.2,to:70})},
    swish(){noise(.18,{vol:.12,f:1800,to:600,q:2})},
    drop(){tone(520,.08,{type:'triangle',vol:.12,to:820});noise(.12,{vol:.08,f:500})},
    wrong(){tone(220,.18,{type:'square',vol:.06,to:150})},
    toss(){noise(.28,{vol:.22,f:900,to:3000})},
    perfect(){[784,988,1319].forEach((f,i)=>tone(f,.18,{type:'triangle',vol:.13,at:i*.06}))},
    good(){tone(660,.15,{type:'triangle',vol:.11})},
    miss(){tone(240,.22,{type:'sawtooth',vol:.06,to:150})},
    thud(){tone(110,.12,{vol:.28,to:60});noise(.06,{vol:.2,type:'lowpass',f:500})},
    sprinkle(){for(let i=0;i<3;i++)tone(2400+Math.random()*900,.03,{type:'square',vol:.03,at:i*.03})},
    squirt(){noise(.12,{vol:.08,f:600,to:300,q:3})},
    step(){tone(988,.08,{type:'triangle',vol:.08});tone(1319,.12,{type:'triangle',vol:.08,at:.07})},
    coin(){tone(988,.08,{type:'square',vol:.06});tone(1319,.28,{type:'square',vol:.06,at:.08})},
    bell(){tone(1760,.3,{vol:.09});tone(1318,.45,{vol:.09,at:.13})},
    bad(){tone(196,.4,{type:'sawtooth',vol:.08,to:100})},
    tick(){tone(1250,.04,{type:'square',vol:.045})},
    serve(){noise(.3,{vol:.12,f:700,to:2400});tone(1568,.4,{vol:.1,at:.1})},
    ding(){tone(2637,.9,{vol:.14});tone(3951,.6,{vol:.05,at:.01});tone(2637,.7,{vol:.08,at:.12})},
    win(){[523,659,784,1047].forEach((f,i)=>tone(f,.26,{type:'triangle',vol:.14,at:i*.12}));tone(1047,.7,{type:'triangle',vol:.1,at:.52})},
    lose(){[392,330,262].forEach((f,i)=>tone(f,.32,{type:'triangle',vol:.12,at:i*.2}))}
  };
  return {init,fx,loop,stopLoop,get on(){return on},setOn(v){on=v;if(!v)stopLoop()}};
})();

function W(){return stage.clientWidth}function H(){return stage.clientHeight}
function anchors(){
  if(S3){const a=S3.anchors();if(a)return a}
  const w=W(),h=H(),c={x:w/2,y:h*.55,r:Math.min(w,h)*.3};const a={vessel:c,target:{x:c.x,y:c.y,r:c.r*.7}};
  if(G&&G.def.g==='slice'){const n=G.def.n,L=Math.min(w*.7,420),y0=c.y-70,y1=c.y+70;
    if(G.def.item==='三文治')a.lines=[{a:{x:c.x-110,y:c.y-110},b:{x:c.x+110,y:c.y+110}},{a:{x:c.x+110,y:c.y-110},b:{x:c.x-110,y:c.y+110}}];
    else if(G.def.item==='菠蘿包')a.lines=[{a:{x:c.x-L/2,y:c.y},b:{x:c.x+L/2,y:c.y}}];
    else a.lines=Array.from({length:n},(_,i)=>{const x=c.x-L/2+L*(i+1)/(n+1);return {a:{x,y:y0},b:{x,y:y1}}});
    a.lines.forEach((l,i)=>l.done=!!(G.cut&&G.cut[i]))}
  return a;
}
function pathPolys(type){
  if(S3)return S3.path(type);
  const c=anchors().vessel,R=c.r*.75,poly=[];
  if(type==='zigzag'){for(let i=0;i<=6;i++)poly.push({x:c.x+(i%2?1:-1)*R,y:c.y-R*.7+i*(1.4*R/6)});const d=[];for(let i=1;i<poly.length;i++)for(let k=0;k<12;k++)d.push({x:poly[i-1].x+(poly[i].x-poly[i-1].x)*k/12,y:poly[i-1].y+(poly[i].y-poly[i-1].y)*k/12});return [d]}
  if(type==='spiral'){for(let a=0;a<=120;a++){const t=a/120,th=t*Math.PI*4.4-Math.PI/2,r=R*(.18+.82*t);poly.push({x:c.x+Math.cos(th)*r,y:c.y+Math.sin(th)*r})}return [poly]}
  if(type==='tarts'){return [-1,0,1].map(k=>Array.from({length:37},(_,a)=>{const th=a/36*Math.PI*2;return {x:c.x+k*R*.9+Math.cos(th)*R*.25,y:c.y+Math.sin(th)*R*.25}}))}
  for(let a=0;a<=60;a++){const th=a/60*Math.PI*2-Math.PI/2;poly.push({x:c.x+Math.cos(th)*R,y:c.y+Math.sin(th)*R})}return [poly];
}

function makeOrder(avoid){
  const L=S.lv;let id,g=0;do{id=pick(L.menu)}while(avoid.includes(id)&&g++<10);
  const dish=DISHES[id],ct=pick(L.cust),c=CUST[ct];const lim=dish.steps.reduce((a,s)=>a+stepLimit(s),0);
  return {id,dish,ct,c,face:pick(c.faces),pat:(lim*1.25+8)*c.pat,res:[],acc:[],spd:[],got:new Set()};
}
function nextOrder(){
  const o=S.queue.shift();S.queue.push(makeOrder([o.id,...S.queue.map(q=>q.id)]));
  S.order=o;S.pat=S.patMax=o.pat;S.complained=false;S.orderNo++;
  // 第一日一定提示；之後嘅日子，呢道菜之前出現過 2 次或以上就唔再提示食材同步驟
  const seen=save.dishSeen[o.id]||0;o.seen=seen;o.reveal=!!S.lv.tutorial||seen<2;save.dishSeen[o.id]=seen+1;persist();
  $('#face').textContent=o.face;animClass($('#avatar'),'enter');$('#mood').textContent='😊';
  say(o.c.greet.replace('{d}',o.dish.name),o.c.name+(o.c.critic?' · 只收完美！':''));
  $('#tNo').textContent='No.'+String(S.orderNo).padStart(3,'0');$('#tEmo').textContent=o.dish.e;$('#tName').textContent=o.dish.name;$('#tPrice').textContent='$'+o.dish.p;
  AFX.fx.bell();if(S3)S3.reset();animClass(document.querySelector('.ticket'),'pop');
  renderSteps();startStep(0);
  if(!o.reveal)later(()=>toast(`🧠 熟手菜！之前整過 ${o.seen} 次，今次憑記憶`),500);
}
function renderSteps(popName){
  const o=S.order;if(!o){$('#steps').innerHTML='';renderIngs();return}
  $('#steps').innerHTML=o.dish.steps.map((s,i)=>{const r=o.res[i];const now=G&&G.idx===i&&G.def.g!=='serve';
    if(!o.reveal&&r==null&&!now)return `<span class="st q"><i class="sn">${i+1}</i> ❓ ？？</span>`;
    const tip=r!=null?` title="準確 ${o.acc[i]} · 速度 ${o.spd[i]}"`:'';
    return `<span class="st ${now?'now':''} ${r!=null?'done':''} ${r!=null&&r<72?'bad':''}"${tip}><i class="sn">${i+1}</i>${GEST[s.g].ic} ${stepTitle(s)}${o.reveal&&stepAmt(s)?` <span class="amt">${stepAmt(s)}</span>`:''}${r!=null?`<b>${gradeTxt[grade(r)]}</b>`:''}</span>`}).join('');
  const now=$('#steps .now');if(now&&isPhone())now.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
  renderIngs(popName);
}
function renderIngs(popName){
  const o=S.order,el=$('#ings');if(!o){el.innerHTML='';el.className='ings';return}
  const list=dishIngs(o.dish),chip=n=>`<span class="ig ${o.got.has(n)?'ok':''} ${n===popName?'pop':''}">${ie(n)} ${n}</span>`;
  if(o.reveal){el.className='ings';el.innerHTML=`<span class="ih">食材</span>`+list.map(chip).join('')}
  else{el.className='ings memo';el.innerHTML=`<span class="ih">🧠 熟手菜</span><span class="mh">整過 ${o.seen} 次${isPhone()?'':' · 食材同步驟'}憑記憶</span>`+list.filter(n=>o.got.has(n)).map(chip).join('')}
}
function startStep(i){
  const o=S.order,def=o.dish.steps[i];
  if(!def){startServe();return}
  const sc=SCENE[def.g](def);
  G={idx:i,def,t:0,limit:stepLimit(def),prog:0,scores:[],miss:0,done:false,trail:[],down:false,idle:0,hintT:0,n:0,cut:[],cov:null,ang:0,radii:[],pullState:'low',maxH:0,cycleT:0,ringT:0,lastRev:null,dir:0,devs:[]};
  if(S3){S3.setStation(sc);setup3D(def)}
  const title=stepTitle(def);$('#bIc').textContent=GEST[def.g].ic;$('#bTitle').textContent=title;$('#bSub').textContent=def.g==='drag'&&o.reveal?'要落：'+def.items.map(n=>ie(n)+n).join('、'):GEST[def.g].hint;animClass($('#banner'),'pop');
  // 示範手勢
  const first=!save.seen[def.g];G.hintT=(S.lv.tutorial||first)?2.4:0;if(first){save.seen[def.g]=1;persist()}
  if(def.g==='drag')buildTray(def);else clearTray();
  if(def.g==='drizzle'){G.polys=null}
  if(def.g==='flick'&&S3){S3.startCook();S3.setHeat('ok')}
  updateCount();renderSteps();
}
function setup3D(def){
  if(def.g==='slice')S3.setCutItem(def.item,def.n);
  if(def.g==='pound'&&def.where==='board')S3.setPound('board');
  if(def.g==='stir'&&def.where==='bowl')S3.setBowl();
  if(def.g==='drag'&&def.to==='board'&&def.items.includes('多士'))S3.clearCut();
  if(def.g==='drizzle'){let h=-.55;if(def.on==='plate')h=S3.setPlateDish(def.dish);else if(def.on==='tray')h=-.97;else if(def.on==='waffle')h=-.84;S3.drizzleStart(def.sauce,h)}
  if(def.g==='flick'&&def.where==='pan'&&S.order.dish.steps.every(s=>s.g!=='drag'||s.to!=='pan'))S3.addOne('豬扒');
}
function updateCount(){
  if(!G)return;const d=G.def;let t='';
  if(d.g==='slice')t=`${G.cut.filter(Boolean).length}/${d.n}`;
  else if(d.g==='stir')t=`${Math.min(d.turns,Math.floor(Math.abs(G.ang)/(Math.PI*2)))}/${d.turns}`;
  else if(d.g==='drag')t=`${G.n}/${d.items.length}`;
  else if(d.g==='flick'||d.g==='pull'||d.g==='pound'||d.g==='shake')t=`${G.n}/${d.n}`;
  else if(d.g==='drizzle')t=Math.round(G.prog*100)+'%';

let lastT=0;
function frame(t){

  if(S.running&&!S.paused){
    S.time-=dt;const ti=Math.ceil(S.time);if(ti<=10&&ti>0&&ti!==S.lastTick){S.lastTick=ti;AFX.fx.tick()}
    if(S.order&&G){S.pat-=dt;if(!S.complained&&S.pat/S.patMax<.3){S.complained=true;say(pick(S.order.c.wait),S.order.c.name)}if(S.pat<=0)walkout()}
    if(G&&!G.done){G.t+=dt;G.idle+=dt;G.hintT=Math.max(0,G.hintT-dt);if(G.def.g==='flick')G.ringT+=dt;
      $('#stepBar').style.width=Math.max(0,100-G.t/G.limit*100)+'%';$('#stepBar').style.background=G.t/G.limit>.75?'#ff6a4a':G.t/G.limit>.5?'#ffd35a':'#5cc07f';
      if(G.def.g!=='serve'&&G.t>=G.limit)timeoutStep();
      if(G&&G.def.g==='serve'&&G.t>4.5)serve()}
    renderHUD();renderCustomer();
    if(S.time<=0)endLevel();
  }
  drawOverlay(dt);

}

  const d=G.def,g=d.g;let part=0;
  if(g==='slice')part=G.cut.filter(Boolean).length/d.n;else if(g==='drag')part=G.n/d.items.length;else if(g==='stir'||g==='drizzle')part=G.prog;else part=(G.n||0)/(d.n||1);

  const avg=G.scores&&G.scores.length?G.scores.reduce((a,b)=>a+b,0)/G.scores.length:70;finishStep(part*avg,1,'timeout');

   ${L.tutorial?'':'<p style="font-size:13px">🧠 同一道菜之前出現過 2 次或以上，落單紙就唔再提示食材同步驟，要憑記憶整。</p>'}
   <div class="recipes">${L.menu.map(id=>{const d=DISHES[id],seen=save.dishSeen[id]||0,memo=!L.tutorial&&seen>=2;
     return `<div class="rc"><div class="rc-h"><span>${d.e}</span>${d.name}<em>$${d.p}</em></div>${memo?`<div class="rc-i memo">🧠 已整過 ${seen} 次 · 今日憑記憶</div>`:`<div class="rc-i">${d.steps.map((s,k)=>(k+1)+'. '+GEST[s.g].ic+' '+stepTitle(s)+(stepAmt(s)?' '+stepAmt(s):'')).join(' → ')}</div><div class="rc-g">${dishIngs(d).map(n=>`<span class="ig">${ie(n)} ${n}</span>`).join('')}</div>`}</div>`}).join('')}</div>
   <div class="row"><button class="subbtn" data-act="title">← 選日子</button><button class="mainbtn" data-act="start" data-i="${i}">開工！</button></div>`);
}
function showResult(n,improved){
  const L=S.lv,i=S.li,avg=S.ratings.length?S.ratings.reduce((a,b)=>a+b,0)/S.ratings.length:0;
  const msg=n===3?'神級手勢！全場拍爛手掌！':n===2?'手勢純熟，街坊讚好！':n===1?'達標收工！':'差少少，再練下手勢！';
  const revs=S.reviews.slice(-3).reverse(),hasNext=i<LEVELS.length-1&&unlocked(i+1);
  showModal(`<div class="kicker">${L.name} · 收工</div>
   <div class="bigstars">${[0,1,2].map(k=>`<span class="${k<n?'on':''}" style="animation-delay:${.25+k*.28}s">★</span>`).join('')}</div>
   <h1>${msg}</h1><div class="money">$${S.score}</div>${improved?'<p>🎉 打破個人紀錄！</p>':''}
   <div class="stats"><div><b>${S.served}</b><span>出餐</span></div><div><b>${S.perfects}</b><span>完美</span></div><div><b>${S.best}</b><span>最高連擊</span></div><div><b>${S.walkouts}</b><span>走單</span></div><div><b>${avg?avg.toFixed(1):'—'}</b><span>平均食評 ★</span></div><div><b>${S.accs.length?Math.round(S.accs.reduce((a,b)=>a+b,0)/S.accs.length):'—'}</b><span>🎯 平均準確</span></div><div><b>${S.spds.length?Math.round(S.spds.reduce((a,b)=>a+b,0)/S.spds.length):'—'}</b><span>⚡ 平均速度</span></div></div>
   <details class="howscore"><summary>💡 分數同營業額點計？</summary><ul>
     <li><b>準確</b>：切得啱唔啱虛線、有冇落錯料、攪得圓唔圓、淋汁貼唔貼線、翻鑊夾唔夾中綠圈等。</li>
     <li><b>速度</b>：每步有時間條，用咗大約一半（視乎手勢）之前完成就 100 分，之後越慢越低，時間到就 0 分。</li>
     <li>每步評分 = 準確 × 75% + 速度 × 25%；成碟菜評分 = 各步平均。90↑ 完美、72↑ 好、45↑ 普通，以下失手。</li>
     <li>收入 = 菜價 × (完美 100%／好 85%／普通 50%／失手 0) ＋ 小費（完美有連擊加成，食家只畀完美）＋ 快手 $5（客人耐性仲有一半左右）。走單扣 $10。</li></ul></details>
   ${revs.length?`<h3>— 客人留言 —</h3><div class="reviews">${revs.map(r=>`<div class="rv"><span class="f">${r.face}</span><span>「${r.text}」<br><small style="color:#7a6656">${r.dish}</small></span><span class="r">${'★'.repeat(r.rating)}</span></div>`).join('')}</div>`:''}
   <div class="row"><button class="subbtn" data-act="title">← 選日子</button><button class="${hasNext?'subbtn':'mainbtn'}" data-act="start" data-i="${i}">↺ 再玩</button>${hasNext?`<button class="mainbtn" data-act="pick" data-i="${i+1}">下一日 →</button>`:''}</div>`);
  if(n>0){AFX.fx.win();confetti()}else AFX.fx.lose();
}
function confetti(){const cols=['#c7352b','#f2b33d','#45a868','#3a6ea5','#fff'];for(let i=0;i<70;i++){const d=document.createElement('div');d.className='confetti';d.style.left=rand(0,100)+'vw';d.style.background=pick(cols);d.style.animationDuration=rand(1.8,3.4)+'s';d.style.animationDelay=rand(0,.6)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),4200)}}

/* ================= 事件 ================= */
overlay.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;AFX.init();AFX.fx.tap();const a=b.dataset.act,i=+b.dataset.i;
  if(a==='pick')showIntro(i);else if(a==='start')startLevel(i);else if(a==='title')showTitle();else if(a==='resume')resume();else if(a==='restart')startLevel(S.li);
  else if(a==='sound'){toggleSound();showTitle()}else if(a==='reset'){if(confirm('確定清除所有星星同解鎖紀錄？')){save.stars={};save.seen={};save.dishSeen={};persist();showTitle()}}});
function toggleSound(){AFX.setOn(!AFX.on);save.sound=AFX.on;persist();$('#btnSound').textContent=AFX.on?'🔊':'🔇';if(AFX.on){AFX.init();AFX.fx.tap()}}
$('#btnSound').addEventListener('click',toggleSound);
$('#btnPause').addEventListener('click',()=>{AFX.init();S.paused?resume():pause()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.running){S.paused?resume():pause()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});

$('#btnSound').textContent=AFX.on?'🔊':'🔇';
try{const _bi=document.getElementById('tBrandImg');if(_bi)_bi.src=window.RP_LOGO}catch(e){}
if(window.S3){try{window.S3.mount(stage);S3=window.S3;stage.querySelector('canvas.gl3d').style.zIndex=0;S3.setStation('wok')}catch(e){console.warn('3D 模式未能啟動，改用 2D：',e);S3=null;const c=stage.querySelector('canvas.gl3d');if(c)c.remove()}}
resizeOv();renderHUD();showTitle();requestAnimationFrame(frame);
window.__g2={S,get G(){return G},anchors,pathPolys};
})();
</script>
</body>
